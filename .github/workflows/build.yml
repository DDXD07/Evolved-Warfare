# Compila el mod automáticamente en GitHub cada vez que subes cambios
# (o cuando lo lanzas a mano desde la pestaña "Actions").
# El .jar aparece como artefacto descargable "evolved-warfare".

name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: evolved-warfare
          path: build/libs/*.jar
      # además, deja el .jar en la rama "builds" (un solo commit, se reemplaza en cada compilación)
      - name: publish jar to the builds branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/out && cp build/libs/*.jar /tmp/out/
          cd /tmp/out
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds

  # pruebas dentro del juego: un servidor sin pantalla coloca las máquinas de asedio, se sube y dispara
  gametest:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: run game tests
        run: |
          mkdir -p build/gametest && echo "eula=true" > build/gametest/eula.txt
          set -o pipefail
          ./gradlew runGametest --stacktrace 2>&1 | tee build/gametest-gradle.log
      - name: show test results
        if: always()
        run: |
          LOG=build/gametest-gradle.log
          grep -h "EW-GAMETEST" $LOG | head -n 10 | sed 's/^.*\[EW-GAMETEST\]/::notice::/' || true
          grep -hiE "failed|exception|error" $LOG | grep -v "EW-GAMETEST" | head -n 10 | sed 's/^/::error::/' || true
      # el registro entero, en la rama "gametest-logs" (para leerlo sin descargar artefactos)
      - name: publish test logs
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/gt && cp -r build/gametest/logs /tmp/gt/ 2>/dev/null || true
          cp build/gametest/junit.xml /tmp/gt/ 2>/dev/null || true
          cp build/gametest-gradle.log /tmp/gt/ 2>/dev/null || true
          cd /tmp/gt
          git init -q -b gametest-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Gametest ${GITHUB_SHA}" || true
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gametest-logs
