plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom añade automáticamente los repositorios de Minecraft y Fabric.
	// Mod Menu (opcional): solo para compilar la pantalla de configuración.
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
	}
}

// Pruebas dentro del juego (servidor sin pantalla): ./gradlew runGametest. No van en el .jar.
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath
		runtimeClasspath += sourceSets.main.output
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"evolvedwarfare" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"evolvedwarfare-gametest" {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		gametest {
			server()
			name "Game Test"
			source sourceSets.gametest
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.file('build/gametest/junit.xml')}"
			runDir "build/gametest"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Escrito con los nombres de Yarn (mappings de Fabric).
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Mod Menu no es obligatorio: si está instalado, enseña la pantalla de configuración del mod.
	modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
		transitive = false
	}
	// Opcional: pon aquí (carpeta libs/) el .jar de Golden Coin Merchants para probar la integración.
	modLocalRuntime fileTree(dir: "libs", include: "*.jar")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
